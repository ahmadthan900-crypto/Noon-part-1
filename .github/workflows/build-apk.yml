
name: Build NOON Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          mkdir extracted
          unzip -q android.zip -d extracted

      - name: Find Android project
        id: project
        run: |
          FILE=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          test -n "$FILE"
          echo "dir=$(dirname "$FILE")" >> "$GITHUB_OUTPUT"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          cd "${{ steps.project.outputs.dir }}"
          gradle --no-daemon assembleDebug

      - name: Locate APK
        run: |
          APK=$(find extracted -type f -path "*/build/outputs/apk/debug/*.apk" -print -quit)
          test -n "$APK"
          mkdir -p output
          cp "$APK" output/NOON.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOON-APK
          path: output/NOON.apk
          if-no-files-found: error
