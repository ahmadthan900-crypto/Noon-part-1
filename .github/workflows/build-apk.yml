
name: Build NOON Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract ZIP
        run: |
          mkdir extracted
          unzip -q android.zip -d extracted

      - name: Find Android project
        id: project
        run: |
          FILE=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          test -n "$FILE"
          echo "dir=$(dirname "$FILE")" >> "$GITHUB_OUTPUT"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          cd "${{ steps.project.outputs.dir }}"
          gradle --no-daemon assembleDebug

      - name: Find APK
        run: |
          APK=$(find extracted -type f -path "*/build/outputs/apk/debug/*.apk" -print -quit)
          test -n "$APK"
          mkdir -p output
          cp "$APK" output/NOON.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOON-APK
          path: output/NOON.apk
          if-no-files-found: error
